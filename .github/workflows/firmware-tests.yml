name: Firmware tests

on:
  pull_request:
    paths:
      - "firmware/src/**"
      - "firmware/tests/**"
      - "firmware/Makefile"
      - ".github/workflows/firmware-tests.yml"

jobs:
  firmware-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run firmware tests
        run: make test
        working-directory: firmware
