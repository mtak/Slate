name: Firmware tests

on:
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-tests.yml"

permissions:
  contents: read

jobs:
  firmware-memory-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run host and sanitizer tests
        run: make test
        working-directory: firmware

  firmware-memory-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up PlatformIO
        run: make setup
        working-directory: firmware
      - name: Build production firmware
        run: make build
        working-directory: firmware
      - name: Compile ESP32 Unity memory tests (build only)
        run: make build-memory-test
        working-directory: firmware
