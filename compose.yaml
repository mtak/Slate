services:
  slate-server:
    build:
      context: ./server
    expose:
      - "8000"
    environment:
      SLATE_HOST: 0.0.0.0
      SLATE_REFRESH_SECONDS: ${SLATE_REFRESH_SECONDS:-60}
      SLATE_DEVICE_TOKEN: ${SLATE_DEVICE_TOKEN:?Set SLATE_DEVICE_TOKEN in .env}
      SLATE_REQUIRE_HTTPS: ${SLATE_REQUIRE_HTTPS:-true}
      SLATE_LAYOUT_PATH: /config/layout.json
      SLATE_PROVIDER: ${SLATE_PROVIDER:-sample}
      SLATE_GOOGLE_CREDENTIALS: /run/secrets/google-calendar-service-account.json
      SLATE_GOOGLE_CALENDAR_ID: ${SLATE_GOOGLE_CALENDAR_ID:-}
      SLATE_TIMEZONE: ${SLATE_TIMEZONE:-UTC}
      SLATE_CALENDAR_MAX_EVENTS: ${SLATE_CALENDAR_MAX_EVENTS:-6}
      SLATE_CALENDAR_DAYS_AHEAD: ${SLATE_CALENDAR_DAYS_AHEAD:-14}
    volumes:
      - ./server:/config:ro
      - ${SLATE_GOOGLE_CREDENTIALS_DIR:-./secrets}:/run/secrets:ro
    restart: unless-stopped
