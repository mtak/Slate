services:
  slate-server:
    build:
      context: ./server
    ports:
      - "${SLATE_PORT:-8000}:8000"
    environment:
      SLATE_HOST: 0.0.0.0
      SLATE_REFRESH_SECONDS: ${SLATE_REFRESH_SECONDS:-60}
      SLATE_DATE_FORMAT: ${SLATE_DATE_FORMAT:-%A, %B %d}
      SLATE_LAYOUT_PATH: /config/layout.json
    volumes:
      - ./server:/config:ro
    restart: unless-stopped
