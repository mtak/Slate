services:
  slate-server:
    build:
      context: ./server
    ports:
      - "${SLATE_PORT:-8000}:8000"
    environment:
      SLATE_HOST: 0.0.0.0
      SLATE_REFRESH_SECONDS: ${SLATE_REFRESH_SECONDS:-60}
      SLATE_LAYOUT_PATH: /config/layout.json
    volumes:
      - ./server/layout.json:/config/layout.json
    restart: unless-stopped
