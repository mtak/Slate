services:
  slate-server:
    build:
      context: ./server
    expose:
      - "8000"
    environment:
      SLATE_HOST: 0.0.0.0
      SLATE_REFRESH_SECONDS: ${SLATE_REFRESH_SECONDS:-60}
      SLATE_DATE_FORMAT: ${SLATE_DATE_FORMAT:-%A, %B %d}
      SLATE_DEVICE_TOKEN: ${SLATE_DEVICE_TOKEN:?Set SLATE_DEVICE_TOKEN in .env}
      SLATE_REQUIRE_HTTPS: ${SLATE_REQUIRE_HTTPS:-true}
      SLATE_LAYOUT_PATH: /config/layout.json
      SLATE_CALENDAR_ICAL_URL: ${SLATE_CALENDAR_ICAL_URL:-}
      TZ: ${TZ:-UTC}
      SLATE_CALENDAR_MAX_EVENTS: ${SLATE_CALENDAR_MAX_EVENTS:-6}
      SLATE_CALENDAR_DAYS_AHEAD: ${SLATE_CALENDAR_DAYS_AHEAD:-14}
      SLATE_HOME_ASSISTANT_URL: ${SLATE_HOME_ASSISTANT_URL:-}
      SLATE_HOME_ASSISTANT_TOKEN: ${SLATE_HOME_ASSISTANT_TOKEN:-}
      SLATE_HOME_ASSISTANT_POWER_CONSUMPTION_ENTITY: ${SLATE_HOME_ASSISTANT_POWER_CONSUMPTION_ENTITY:-}
      SLATE_WEATHER_LATITUDE: ${SLATE_WEATHER_LATITUDE:-52.04}
      SLATE_WEATHER_LONGITUDE: ${SLATE_WEATHER_LONGITUDE:-4.33}
      SLATE_WEATHER_TIMEZONE: ${SLATE_WEATHER_TIMEZONE:-Europe/Amsterdam}
      SLATE_WEATHER_FORECAST_HOURS: ${SLATE_WEATHER_FORECAST_HOURS:-4}
      SLATE_WEATHER_FORECAST_DAYS: ${SLATE_WEATHER_FORECAST_DAYS:-4}
      SLATE_LITERAL_TEXT_FILE: ${SLATE_LITERAL_TEXT_FILE:-}
    volumes:
      - ./server:/config:ro
    restart: unless-stopped
