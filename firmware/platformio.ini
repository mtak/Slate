[platformio]
default_envs = slate_esp32

[env:slate_esp32]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<partial_refresh_diagnostic.cpp>

[env:slate_esp32_v2_old]
extends = env:slate_esp32
build_flags = -DSLATE_EPD_PROFILE_V2_OLD

[env:slate_esp32_partial_diag]
extends = env:slate_esp32
build_src_filter = -<*> +<partial_refresh_diagnostic.cpp> +<frame.cpp> +<display_io.cpp>

[env:slate_esp32_partial_diag_v2_old]
extends = env:slate_esp32_v2_old
build_src_filter = -<*> +<partial_refresh_diagnostic.cpp> +<frame.cpp> +<display_io.cpp>
