[platformio]
default_envs = slate_esp32

[env:slate_esp32]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<partial_refresh_diagnostic.cpp> -<partial_diff_diagnostic.cpp>

[env:slate_esp32_v2_old]
extends = env:slate_esp32
build_flags = -DSLATE_EPD_PROFILE_V2_OLD

[env:slate_esp32_watchdog_demo]
extends = env:slate_esp32
build_flags = -DSLATE_WATCHDOG_DEMO

[env:slate_esp32_partial_diag]
extends = env:slate_esp32
build_src_filter = -<*> +<partial_refresh_diagnostic.cpp> +<frame.cpp> +<display_io.cpp>

[env:slate_esp32_partial_diag_v2_old]
extends = env:slate_esp32_v2_old
build_src_filter = -<*> +<partial_refresh_diagnostic.cpp> +<frame.cpp> +<display_io.cpp>

[env:slate_esp32_partial_diff_diag]
extends = env:slate_esp32
build_src_filter = -<*> +<partial_diff_diagnostic.cpp> +<frame.cpp> +<display_io.cpp>

[env:slate_esp32_partial_diff_diag_v2_old]
extends = env:slate_esp32_v2_old
build_src_filter = -<*> +<partial_diff_diagnostic.cpp> +<frame.cpp> +<display_io.cpp>

[env:slate_esp32_memory_test]
extends = env:slate_esp32
test_framework = unity
test_filter = test_memory_device
test_build_src = yes
build_src_filter = -<*> +<frame.cpp> +<frame_ingestion.cpp>
